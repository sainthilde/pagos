spring:
  application:
    name: cp-comunes-query-api
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATASOURCE_HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: ${DATASOURCE_HIKARI_MIN_IDLE:1}
      idle-timeout: ${DATASOURCE_HIKARI_IDLETIMEOUT:20000}
      connection-timeout: ${DATASOURCE_HIKARI_CNXTIMEOUT:10000}
      max-lifetime: ${DATASOURCE_HIKARI_MAXLIFETIMEOUT:90000}
  jpa:
    generate-ddl: ${JPA_GEN_DDL:false}
    hibernate:
      ddl-auto: ${JPA_HIBERNATEDDL:none}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    show-sql: ${JPA_SHOW_SQL:true}
  data:
    redis:
      host: ${REDIS_HOST:00.00.00.00}
      port: ${REDIS_PORT:1}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL:false}
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TTL:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:00.00.00.00:8080}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:cp2}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: true
      interval-attempts: ${KAFKA_CONSUMER_INTERVAL_ATTEMPTS:5000}
      max-attempts: ${KAFKA_CONSUMER_MAX_ATTEMPTS:3}
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    topics:
      notificacion-pendiente: ${NOTIFICACION_PENDIENTE_TOPIC:vuce-pasarela-notificacion-pendiente-topic-cp}
      notificacion-pendiente-response: ${NOTIFICACION_PENDIENTE_RESPONSE_TOPIC:vuce-pasarela-notificacion-pendiente-response-topic}
      notificacion-pago: ${NOTIFICACION_PAGO_TOPIC:vuce-pasarela-notificacion-pago-topic}
      notificacion-pago-response: ${NOTIFICACION_PAGO_RESPONSE_TOPIC:vuce-pasarela-notificacion-pago-response-topic}
      notificacion-anulacion: ${NOTIFICACION_ANULACION_TOPIC:vuce-pasarela-notificacion-anulacion-topic}
      notificacion-anulacion-response: ${NOTIFICACION_ANULACION_RESPONSE_TOPIC:vuce-pasarela-notificacion-anulacion-response-topic}
      notificacion-extorno: ${NOTIFICACION_EXTORNO_TOPIC:vuce-pasarela-notificacion-extorno-topic}
      notificacion-extorno-response: ${NOTIFICACION_EXTORNO_RESPONSE_TOPIC:vuce-pasarela-notificacion-extorno-response-topic}
      notificacion-expiracion: ${NOTIFICACION_EXPIRACION_TOPIC:vuce-pasarela-notificacion-expiracion-topic}
      notificacion-expiracion-response: ${NOTIFICACION_EXPIRACION_RESPONSE_TOPIC:vuce-pasarela-notificacion-expiracion-response-topic}
      dlq-topic: ${DLQ_TOPIC:vuce-cp-generic-topic-dlq}
springdoc:
  api-docs:
    path: /api-docs.html
    version: openapi_3_1
  swagger-ui:
    display-request-duration: true
    groups-order: DESC
    operationsSorter: method
    disable-swagger-default-url: true
    use-root-path: true
    path: /swagger-ui.html
server:
  port: ${SERVER_PORT:4555}
  servlet:
    context-path: ${SERVLET_CONTEXT_PATH:/cp2/sp-pagos}
  error:
    include-stacktrace: "ALWAYS"
    include-message: "ALWAYS"
management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:info}
  endpoint:
    health:
      show-details: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}
#  metrics:
#    export:
#      prometheus:
#        enabled: ${MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED:false}
feign:
  client:
    config:
      default:
        connectTimeout: ${FEIGN_CONNECT_TIMEOUT:5000}
        readTimeout: ${FEIGN_READ_TIMEOUT:5000}
        loggerLevel: ${FEIGN_LOGGER_LEVEL:full}
    oauth-api:
      url: ${OAUTH_API_URL}
      username: ${OAUTH_API_USERNAME}
      password: ${OAUTH_API_PASSWORD}
      grant-type: client_credentials
      scope: gp:gp_read
    gestor-procedimiento-api:
      base-url: ${GESTOR_PROCEDIMIENTO_API_URL:http://router-default.apps.desarrollo.vuce.gob.pe/gestor-procedimiento}
    ordenpago-sunat-api:
      base-url: ${ORDENPAGO_SUNAT_API_URL:https://landing-desa.vuce.gob.pe/v1/vuce-services/pasarela}
    document-api:
      base-url: ${DOCUMENT_API_URL:http://router-default.apps.desarrollo.vuce.gob.pe/cp2/documento}
    comunes-query-api:
      base-url: ${COMUNES_QUERY_API_URL:https://gateway-apim-desa.vuce.gob.pe/pass-through-https-desa/cp2/comunes-query/1.0}
    comunes-command-api:
      base-url: ${COMUNES_COMMAND_API_URL:https://gateway-apim-desa.vuce.gob.pe/pass-through-https-desa/cp2/comunes-command/1.0}
    tramites-query-api:
      base-url: ${TRAMITES_QUERY_API_URL:http://router-default.apps.desarrollo.vuce.gob.pe/cp2/tramiteyrectificacion-query/1.0}
    tramites-command-api:
      base-url: ${TRAMITES_COMMAND_API_URL:http://router-default.apps.desarrollo.vuce.gob.pe/cp2/tramiteyrectificacion-command/1.0}
logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    org.apache.kafka: ERROR
    org.springframework.kafka: ERROR
app:
  comunes:
    url: ${COMUNES_URL}
    host: ${COMUNES_HOST}